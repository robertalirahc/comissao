<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso ao acervo | Comissão da UFPE</title><link rel="stylesheet" href="acesso.css"></head>
<body><main class="login"><div class="emblem" aria-hidden="true">CV</div><p class="eyebrow">COMISSÃO DA VERDADE UFPE</p><h1>Pesquisa no<br>acervo documental</h1><p class="intro">Digite a senha compartilhada para acessar os arquivos e os modelos de referências.</p><form id="loginForm"><label for="password">Senha de acesso</label><div class="password-row"><input id="password" type="password" autocomplete="current-password" required autofocus><button id="togglePassword" type="button" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div><button class="enter" id="enterButton" type="submit">Entrar no portal <span aria-hidden="true">→</span></button><p id="message" role="status" aria-live="polite"></p></form><p class="foot">Arquivos • Referências • Pesquisa documental</p><noscript>Ative o JavaScript para abrir o portal.</noscript></main><script src="acesso.js"></script></body></html>
